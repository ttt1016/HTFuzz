# HTFuzz Python 代码标准
# 适用范围: scripts/（活跃代码）; scripts/legacy/ 为冻结的历史脚本，豁免
# 检查: python3 -m ruff check scripts/  ;  格式化: python3 -m ruff format scripts/
# 需要: pip install ruff

line-length = 100
target-version = "py39"

exclude = [
    "scripts/legacy",
    "perip",
    "fuzz/out",
]

[lint]
# F   pyflakes: 未用导入/变量、重复定义、重复字典键、f-string 冗余 —— 真缺陷类
# I   导入排序
# E9  语法级错误
select = ["F", "I", "E9"]
